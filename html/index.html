<body id="all" class="flex flex-col min-h-screen font-['Inter']">
    <div id="navbar"
        class="flex items-center shadow-lg p-4 border-b-[1px] border-b-gray-300 bg-gradient-to-r from-white via-gray-100 to-white h-16">
        <button class="inline-flex items-center border border-blue-secondary px-3 py-1.5 rounded-md text-blue-secondary hover:bg-cyan-50 hidden">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                class="h-6 w-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18">
                </path>
            </svg>
            <span class="ml-1 font-bold text-lg">Back</span>
        </button>
        <div class="flex justify-center items-center space-x-4 w-full font-sans text-5xl group">
            <div id="Tim" class="text-blue-primary font-extrabold tracking-wide group-hover:text-orange-secondary transition duration-300">TIME</div>
            <div id="Tix" class="text-orange-primary font-extrabold tracking-wide group-hover:text-blue-secondary transition duration-300">TIX</div>
        </div>

        <img src="../res/img/no-backround-no-text-logo.png" alt="Logo" class="w-15 h-14 mr-1.5 hover:-rotate-180 trasition duration-200">
    </div>

    <div id="list-and-timer-wrapper" class="flex h-[calc(100vh-64px)]">
        <div id="list-of-elements" class="flex flex-col w-1/4 rounded-r-3xl h-fit max-h border-b border-r shadow-md relative select-none bg-white max-h-full ">
            <div id="resizer" class="z-40 w-4 h-full absolute right-0 -mr-2 cursor-ew-resize select-none"></div>
             <!-- TODO improve UI make the list list header, especially the timer name stand out AND REPLACE IT WITH THE TIMER FILE NAME -->
            <div id="list-name" class="flex justify-center items-center text-orange-primary p-2 text-2xl font-bold border-b shadow-sm">SUBTIMER LIST</div>

            <div id="list-content" class="relative overflow-y-auto overflow-x-hidden">
                <div class="repeater">
                    <div class="repeater-values">
                        <p class="edit-button-repeater hidden">...</p>
                        <p class="current-repeats w-full text-center mx-4 z-10">0</p>
                        <p class="total-repeats absolute right-[14px]">2</p>
                    </div>
                    <div class="subtimer">
                        <p class="edit-button-subtimer hidden">...</p>
                        <p class="name w-full text-center mx-3 z-10">a</p>
                        <p class="duration absolute right-4">1</p>
                    </div>
                </div>
            </div>

            <div id="list-footer" class="flex justify-between top-shadow pt-7 p-4 z-40">
                <div id="trash-bin" class="absolute bg-red-300 size-12 right-5 rounded-lg bottom-24 hover:shadow-custom-amber hover:bg-red-400 hover:opacity-85 hover:shadow-red-600 opacity-0 transition-opacity duration-300 z-50 hidden">
                    <img src="../res/img/trash_bin_icon.png" class="hover:shake transition">
                </div>
                
                <button id="edit-mode-button" onclick="this.blur()"
                    class="size-11 bg-orange-secondary rounded-xl text-center text-white font-bold hover:shadow-custom-amber hover:shadow-amber-600 hover:scale-125 transition-all duration-500">Edit</button>
                <button id="add-element-button" onclick="this.blur()"
                    class="size-11 bg-blue-secondary rounded-xl text-center text-white font-bold text-4xl flex justify-center items-center pb-1 hover:shadow-custom-amber hover:shadow-blue-600 hover:scale-125 transition-all duration-500">+</button>
            </div>
        </div>

        <div id="timer-interface-wrapper" class="relative flex flex-col flex-grow justify-between overflow-y-auto items-center">
            <p id="current-subtimer-name" class="flex-none text-3xl text-blue-primary font-semibold pt-4 z-20"></p>
            
            <div id="timer" class="h-full flex absolute justify-center items-center">
                <div class="flex justify-center items-center bg-blue-dark-primary rounded-full size-96">
                    <div id="big-timer-time" class="absolute flex justify-center items-center text-5xl font-sans text-blue-light-primary z-10 select-none"></div>
                    <div id="progress-bar" role="progressbar" aria-valuemax="100" aria-valuemin="0" style="--value:0"
                        class="timer-progress relative flex justify-center items-center size-[90%]"></div>
                </div>
