<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../src/output.css">
    <script type="module" src="../dest/script.js"></script>
</head>

<body>
<div id="viewport-wrapper" class="flex flex-col h-screen">

<div id="navbar" class="flex items-center p-4 bg-gradient-to-r from-white via-gray-100 to-white shadow-lg h-16 z-10">
    <button class="inline-flex items-center border border-light-blue-primary px-3 py-1.5 rounded-md text-light-blue-primary hover:bg-cyan-50">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-6 w-6">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18">
            </path>
        </svg>
        <span class="ml-1 font-bold text-lg">Back</span>
    </button>
    <div class="flex justify-center items-center space-x-4 w-full text-5xl  group">
        <div id="Tim" class="text-blue-primary font-extrabold tracking-wide group-hover:text-orange-secondary transition duration-300">TIME</div>
        <div id="Tix" class="text-orange-primary font-extrabold tracking-wide group-hover:text-blue-secondary transition duration-300 ">TIX</div>
    </div>

    <img src="../res/img/no-backround-no-text-logo.png" alt="Logo" class="w-15 h-14 mr-1.5 hover:-rotate-180 trasition duration-200">
</div>

<div id="user-interface-wrapper" class="h-full flex justify-between ">
    <!--TODO maybe make this panel more visible, like adding a top border and a white bg -->
    <ol id="list-of-intervals" class="flex-none rounded-r-3xl z-20 w-1/4 border-r-gray-300 border-r-[1px] border-b-[1px]">
            <div id="list-header" class="flex justify-center items-center text-orange-primary p-2 text-2xl font-mono font-bold border-b">*TIMER NAME*</div>
            <div id="list-content" class="overflow-x-hidden">
                <!-- subtimer Model, Can't be deleted -->
                <div class="relative mt-2 mb-2 p-1 bg-gray-100 rounded-full flex items-center">
                    <p class="w-full text-center">squat</p>
                    <p class="absolute right-4">1</p>
                </div>

                <div class="repeater m-1 border-l-8 border-b-[16px] border-t-2 border-orange-secondary rounded-xl">
                    <div class="relative flex bg-orange-secondary text-dark-blue-secondary font-bold rounded-r-lg">
                        <p class="w-full text-center">0</p>
                        <p class="absolute right-4">3</p>
                    </div>

                    <div class="relative mt-2 mb-2 p-1 bg-gray-100 rounded-full flex items-center">
                        <p class="w-full text-center">jump</p>
                        <p class="absolute right-4">1</p>
                    </div>
                    <!-- <div class="relative mt-2 mb-2 p-1 bg-gray-100 rounded-full flex items-center">
                        <p class="w-full text-center">jumpa </p>
                        <p class="absolute right-4">1</p>
                    </div> -->
                </div>
                <div class="relative mt-2 mb-2 p-1 bg-gray-100 rounded-full flex items-center">
                    <p class="w-full text-center">jump</p>
                    <p class="absolute right-4">1</p>
                </div>
                <div class="repeater m-1 border-l-8 border-b-[16px] border-t-2 border-orange-secondary rounded-xl">
                    <div class="relative flex bg-orange-secondary text-dark-blue-secondary font-bold rounded-r-lg">
                        <p class="w-full text-center">0</p>
                        <p class="absolute right-4">3</p>
                    </div>

                    <div class="relative mt-2 mb-2 p-1 bg-gray-100 rounded-full flex items-center">
                        <p class="w-full text-center">jump</p>
                        <p class="absolute right-4">1</p>
                    </div>
                    <div class="relative mt-2 mb-2 p-1 bg-gray-100 rounded-full flex items-center">
                        <p class="w-full text-center">jump</p>
                        <p class="absolute right-4">1</p>
                    </div>
                </div>
                <!-- <div id="subtimer2" class="relative mt-2 mb-2 p-1 bg-gray-100 rounded-full flex items-center">
                    <p class="w-full text-center">pause</p>
                    <p class="absolute right-4">1:00:15</p>
                </div> -->
            </div>
            <!--TODO Fix buttons growing weird-->
            <div id="list-footer" class="flex justify-between pt-2 p-2">
                <button class="size-10 bg-orange-secondary rounded-xl text-center pb-1 text-white hover:shadow-custom-amber hover:shadow-amber-600 hover:size-12 transition-all duration-500">Tbd</button>
                <!--TODO Center the "+"-->
                <button class="size-10 bg-blue-secondary rounded-xl text-center pb-1 text-white font-bold text-4xl flex justify-center items-center hover:shadow-custom-amber hover:shadow-blue-600 hover:size-12 transition-all duration-500">+</button>
            </div>
    </ol>
         
    <div id="timer-interface-wrapper" class="flex flex-grow flex-col pt-4 items-center">
        <div class="flex-none text-3xl underline-offset-2 underline font-semibold">*Subtimer name*</div>
        <div id="timer" class="flex flex-grow justify-center items-center">
            <div class="flex justify-center items-center  bg-dark-blue-primary rounded-full size-96">
                <div id="big-timer-time" class="absolute flex justify-center items-center text-5xl text-light-blue-primary z-10">0.0</div>
                <div id="progress-bar" role="progressbar" aria-valuemax="100" aria-valuemin="0" style="--value:0" class="timer-progress relative flex justify-center items-center size-[90%] text-5xl text-white"></div>
            </div>
        </div>
    <!-- another variant
        <div class="flex justify-center items-center  bg-dark-blue-secondary rounded-full size-96">
            <div id="progress-time" class="absolute flex justify-center items-center text-5xl text-dark-blue-secondary z-10">12:00</div>
            <div id="progress-bar"  style="--value: 10" class="timer-progress relative flex justify-center items-center size-[90%] text-5xl text-white"></div>
        </div> -->
    </div> 
</div> 

</div>
</body>
</html>
