<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../css/output.css">
    <script type="module" src="../dest/timer.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,op sz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
</head>

<body id="all" class="flex flex-col min-h-screen font-['Inter']">

    <div id="navbar"
        class="flex items-center shadow-lg p-4 border-b-[1px] border-b-gray-300 bg-gradient-to-r from-white via-gray-100 to-white h-16">
        <button class="inline-flex items-center border border-blue-secondary px-3 py-1.5 rounded-md text-blue-secondary hover:bg-cyan-50">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                class="h-6 w-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18">
                </path>
            </svg>
            <span class="ml-1 font-bold text-lg">Back</span>
        </button>
        <!-- TODO make this come from left and go to right, the color change -->
        <div class="flex justify-center items-center space-x-4 w-full font-sans text-5xl group">
            <div id="Tim" class="text-blue-primary font-extrabold tracking-wide group-hover:text-orange-secondary transition duration-300">TIME</div>
            <div id="Tix" class="text-orange-primary font-extrabold tracking-wide group-hover:text-blue-secondary transition duration-300">TIX</div>
        </div>

        <img src="../res/img/no-backround-no-text-logo.png" alt="Logo"
            class="w-15 h-14 mr-1.5 hover:-rotate-180 trasition duration-200">
    </div>

    <div id="subtimer-timer-wrapper" class="flex h-[calc(100vh-64px)]">
        <div id="list-of-subtimer" class="flex flex-col w-1/4 rounded-r-3xl h-fit max-h border-b border-r shadow-md relative select-none bg-white max-h-full ">
            <div id="resizer" class="z-50 w-4 h-full absolute right-0 -mr-2 cursor-ew-resize select-none"></div>
             <!-- TODO make the list list header, especially the timer name stand out -->
            <div id="list-header" class="flex justify-center items-center text-orange-primary p-2 text-2xl font-bold border-b shadow-sm">*TIMER NAME*</div>

            <div id="list-content" class="relative overflow-y-auto overflow-x-hidden">
                <div class="subtimer">
                    <p class="edit-button hidden">...</p>
                    <p class="name w-full text-center ml-2 z-10">Start</p>
                    <p class="duration absolute right-4">1</p>
                </div>

                <div class="repeater">
                    <div class="repeater-values">
                        <p class="edit-button-repeater hidden">...</p>
                        <p class="current-repeats w-full text-center ml-4 z-10">0</p>
                        <p class="total-repeats absolute right-4">2</p>
                    </div>

                    <div class="subtimer">
                        <p class="edit-button hidden">...</p>
                        <p class="name absolute w-full text-center">Gata</p>
                        <p class="duration absolute right-4">1</p>
                    </div>
                    <div class="repeater">
                        <div class="repeater-values">
                            <p class="edit-button-repeater hidden">...</p>
                            <p class="current-repeats w-full text-center ml-4 z-10">0</p>
                            <p class="total-repeats absolute right-4">2</p>
                        </div>
    
                        <div class="subtimer">
                            <p class="edit-button hidden">...</p>
                            <p class="name absolute w-full text-center ml-2">Gata</p>
                            <p class="duration absolute right-4">1</p>
                        </div>
                        <div class="repeater">
                            <div class="repeater-values">
                                <p class="edit-button-repeater hidden">...</p>
                                <p class="current-repeats w-full text-center ml-4 z-10">0</p>
                                <p class="total-repeats absolute right-4">2</p>
                            </div>
        
                            <div class="subtimer">
                                <p class="edit-button hidden">...</p>
                                <p class="name absolute w-full text-center">Gata</p>
                                <p class="duration absolute right-4">1</p>
                            </div>
                            <div class="repeater">
                                <div class="repeater-values">
                                    <p class="edit-button-repeater hidden">...</p>
                                    <p class="current-repeats w-full text-center ml-4 z-10">0</p>
                                    <p class="total-repeats absolute right-4">2</p>
                                </div>
            
                                <div class="subtimer">
                                    <p class="edit-button hidden">...</p>
                                    <p class="name absolute w-full text-center">Gata</p>
                                    <p class="duration absolute right-4">1</p>
                                </div>
                                <div class="repeater">
                                    <div class="repeater-values">
                                        <p class="edit-button-repeater hidden">...</p>
                                        <p class="current-repeats w-full text-center ml-4 z-10">0</p>
                                        <p class="total-repeats absolute right-4">2</p>
                                    </div>
                
                                    <div class="subtimer">
                                        <p class="edit-button hidden">...</p>
                                        <p class="name absolute w-full text-center">Gata</p>
                                        <p class="duration absolute right-4">1</p>
                                    </div>
                                </div>
                                <div class="repeater">
                                    <div class="repeater-values">
                                        <p class="edit-button-repeater hidden">...</p>
                                        <p class="current-repeats w-full text-center ml-4 z-10">0</p>
                                        <p class="total-repeats absolute right-4">2</p>
                                    </div>
                
                                    <div class="subtimer">
                                        <p class="edit-button hidden">...</p>
                                        <p class="name absolute w-full text-center">Gata</p>
                                        <p class="duration absolute right-4">1</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div> 
                </div>
                
                <div class="subtimer">
                    <p class="edit-button hidden">...</p>
                    <p class="name absolute w-full text-center">Gata</p>
                    <p class="duration absolute right-4">1</p>
                </div>
            </div>

            <div id="list-footer" class="flex justify-between pt-7 p-4">
                <button id="edit-mode-button"
                    class="size-11 bg-orange-secondary rounded-xl text-center text-white font-bold hover:shadow-custom-amber hover:shadow-amber-600 hover:scale-125 transition-all duration-500">Edit</button>
                <button id="add-button"
                    class="size-11 bg-blue-secondary rounded-xl text-center text-white font-bold text-4xl flex justify-center items-center pb-1 hover:shadow-custom-amber hover:shadow-blue-600 hover:scale-125 transition-all duration-500">+</button>
            </div>
        </div>

        <div id="timer-interface-wrapper" class="relative flex flex-col flex-grow justify-between overflow-y-auto items-center">
            <p id="current-subtimer-name" class="flex-none text-3xl text-blue-primary font-semibold pt-4 z-20"></p>
            
            <div id="timer" class="h-full flex absolute justify-center items-center">
                <div class="flex justify-center items-center bg-blue-dark-primary rounded-full size-96">
                    <div id="big-timer-time" class="absolute flex justify-center items-center text-5xl font-sans text-blue-light-primary z-10 select-none"></div>
                    <div id="progress-bar" role="progressbar" aria-valuemax="100" aria-valuemin="0" style="--value:0"
                        class="timer-progress relative flex justify-center items-center size-[90%]"></div>
                </div>
                <!-- another variant
                <div class="flex justify-center items-center  bg-blue-dark-secondary rounded-full size-96">
                    <div id="progress-time" class="absolute flex justify-center items-center text-5xl text-blue-dark-secondary z-10">12:00</div>
                    <div id="progress-bar"  style="--value: 10" class="timer-progress relative flex justify-center items-center size-[90%] text-5xl text-white"></div>
                </div> -->
            </div>
                
            <!-- TODO maybe add reset button here, prev and next -->
            <div class="mb-12 flex justify-between z-20">
                <button id="button" onclick="this.blur()" class="hidden mx-4 rounded-lg size-10 bg-blue-primary font-extrabold text-base text-white flex justify-center items-center select-none">placeholder</button>
                <button id="pause-button" class="mx-4 rounded-lg size-10 bg-orange-primary font-extrabold text-base text-white flex justify-center items-center select-none">| |</button>
            </div>
            
        </div>
    </div>

    <div id="blurred-backround" class="absolute h-dvh w-screen bg-black opacity-45 z-40 hidden"></div>

    <!-- TODO make this nicer -->
    <div id="modal" class="shadow-xl shadow-gray-500 pb-2 pl-3 pr-3 fixed h-3/4 w-1/3 bg-white m-auto max-h-[100dvh] max-w-[100vh] inset-0 rounded-2xl z-50 hidden">
        <div id="modal-header-container" class="h-1/6 flex justify-center items-center space-x-4 font-bold text-2xl">
            <div class="text-orange-primary">ADD</div>
            <div class="text-blue-primary">TIMER</div>
        </div>

        <div id="modal-body-wrapper" class="h-5/6">
            <form id="timer-form" class="h-full flex flex-col justify-between">
                <!-- Form Body -->
                <div class="h-5/6 flex flex-col justify-center items-center space-y-4">
                    <label for="subtimer-name" class="font-medium">Subtimer Name:</label>
                    <input id="subtimer-name" type="text" class="border border-gray-300 rounded-md p-2 w-full" placeholder="Enter timer name">

                     <label for="timer-duration" class="font-medium">Duration (xx:xx:xx format):</label>
                    <input id="timer-duration" type="text" class="border border-gray-300 rounded-md p-2 w-full" placeholder="Enter duration">
                </div>

                <div id="button-container" class="flex justify-between h-1/6">
                    <button id="modal-add-button"
                       class="flex justify-center items-center bg-gray-50 text-green-600 border border-green-600 rounded-xl w-1/4 h-full ml-3 mr-3 hover:text-white hover:bg-green-600 transition duration-300">Add</button>
                    <button type="button" id="modal-cancel-button"
                        class="flex justify-center items-center bg-gray-50 text-red-600 border border-red-600 rounded-xl w-1/4 h-full ml-3 mr-3 hover:text-white hover:bg-red-600 transition duration-300">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="subtimer-menu" class="flex flex-col shadow-lg bg-blue-200 shadow-gray-400 h-fit hover:shadow-xl hover:shadow-gray-400 transition duration-1000 p-3 pt-8 fixed w-1/2 m-auto max-h-[100dvh] max-w-[100vh] inset-0 rounded-2xl z-50 hidden">
        <div class="shadow-lg shadow-blue-light-primary pb-3 bg-white absolute w-full top-0 pt-4 left-0 rounded-xl">
            <div class="flex text-4xl font-bold justify-center bg-clip-text text-transparent bg-gradient-to-r from-blue-dark-secondary to-blue-light-primary">SUBTIMER MENU</div>
        </div>
        <div class="name-container pl-4 p-2 py-4 flex justify-start bg-white rounded-xl items-center mt-20 bg-opacity-50">
            <label class="subtimer-name text-2xl font-semibold">NAME:</label>
            <input type="text" class="subtimer-name-input flex-grow mx-4 p-2 border border-gray-300 rounded-md">
        </div>
        <div class="time-container pl-4 p-2 py-4 mt-10 flex justify-start bg-white rounded-xl items-center bg-opacity-50">
            <label class="text-2xl font-semibold">TIME:</label>
            <div class="item-picker flex flex-grow justify-center">*ITEM PICKER*</div>
        </div>
        <div class="flex justify-between mt-10 mb-3 mx-3 h-16">
            <button id="subtimer-menu-ok-button"
               class="flex justify-center items-center bg-white bg-opacity-80 text-green-600 border border-green-600 rounded-xl w-20 h-full hover:text-white hover:bg-green-600 transition duration-300">OK</button>
            <button id="subtimer-menu-cancel-button"
                class="flex justify-center items-center bg-white bg-opacity-80 text-red-600 border border-red-600 rounded-xl w-20 h-full hover:text-white hover:bg-red-600 transition duration-300">Cancel</button>
        </div>
    </div>
    
    <div id="repeater-menu" class="flex flex-col shadow-lg bg-orange-secondary shadow-gray-400 h-fit hover:shadow-xl hover:shadow-gray-400 transition duration-1000 p-3 pt-8 fixed w-1/2 m-auto max-h-[100dvh] max-w-[100vh] inset-0 rounded-2xl z-50 hidden">
        <div class="shadow-lg shadow-orange-primary pb-3 bg-white absolute w-full top-0 pt-4 left-0 rounded-xl">
            <div class="flex text-4xl font-bold justify-center bg-clip-text text-transparent bg-gradient-to-r from-orange-dark-primary to-orange-light-primary">REPEATER MENU</div>
        </div>
        <div class="options-container pl-4 p-2 py-4 mt-20 flex justify-start items-center bg-white rounded-xl bg-opacity-50">
            <label class="subtimer-name text-2xl font-semibold">TOTAL REPEATS:</label>
            <div class="item-picker flex flex-grow justify-center">*ITEM PICKER*</div>
        </div>
        <div class="flex justify-between mt-10 mb-3 mx-3 h-16">
            <button id="repeater-menu-ok-button"
               class="flex justify-center items-center bg-white bg-opacity-80 text-green-600 border border-green-600 rounded-xl w-20 h-full hover:text-white hover:bg-green-600 transition duration-300">OK</button>
            <button id="repeater-menu-cancel-button"
                class="flex justify-center items-center bg-white bg-opacity-80 text-red-600 border border-red-600 rounded-xl w-20 h-full hover:text-white hover:bg-red-600 transition duration-300">Cancel</button>
        </div>
    </div>

    <div id="warning-pop-up" class="shadow-xl shadow-gray-500 pb-2 pl-3 pr-3 fixed h-3/4 w-1/3 bg-white m-auto max-h-[100dvh] max-w-[100vh] inset-0 rounded-2xl z-50 hidden">
        <div id="warning-message"></div>
    </div>

    <!-- Align the edit buttons, names and the last value(time / total repeats) -->
    <div id="timer-elements" class="hidden">
        <div id="subtimer-example" class="subtimer">
            <p class="edit-button hidden">...</p>
            <p class="name w-full text-center ml-2 z-10"></p>
            <p class="duration absolute right-4">1</p>
        </div>

        <div id="repeater-example" class="repeater">
            <div class="repeater-values">
                <p class="edit-button-repeater hidden">...</p>
                <p class="current-repeats w-full text-center ml-4 z-10">0</p>
                <p class="total-repeats absolute right-4">2</p>
            </div>

            <div class="subtimer">
                <p class="edit-button hidden">...</p>
                <p class="name w-full text-center ml-2 z-10"></p>
                <p class="duration absolute right-4">1</p>
            </div>
        </div>
    </div>
    <script src="../node_modules/jquery/dist/jquery.min.js" type="text/javascript"></script>
    <script type="module" src="../dest/buttonHandler.js"></script>
</body>

</html>
