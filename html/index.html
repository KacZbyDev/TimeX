<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../src/output.css">
    <script src="../dest/script.js"></script>
</head>

<body>
<div id="viewport-wrapper" class="flex flex-col h-auto">
    <div id="modal-background" class="fixed h-dvh w-screen bg-black opacity-45 z-40 hidden"></div>
    <div id="modal" class="pb-2 pl-3 pr-3 fixed h-3/4 w-1/3 bg-white m-auto max-h-[100dvh] max-w-[100vh] inset-0 rounded-2xl z-50 hidden">
        <div id="modal-header-container" class="h-1/6 flex justify-center items-center space-x-4 font-bold text-2xl">
            <div class="text-blue-600">ADD</div>
            <div class="text-orange-600">TIMER</div>
        </div>

        <div id="modal-body-wrapper" class="h-5/6">
            <form id="timer-form" class="h-full flex flex-col justify-between">
                <!-- Form Body -->
                <div class="h-5/6 flex flex-col justify-center items-center space-y-4">
                    <label for="timer-name" class="font-medium">Timer Name:</label>
                    <input id="timer-name" type="text" class="border border-gray-300 rounded-md p-2 w-full" placeholder="Enter timer name" required>

                    <label for="timer-duration" class="font-medium">Duration (minutes):</label>
                    <input id="timer-duration" type="number" class="border border-gray-300 rounded-md p-2 w-full" placeholder="Enter duration" required>
                </div>


                <div id="button-container" class="flex justify-between h-1/6">

                    <button type="button" id="modal-delete-button" class="flex justify-center items-center bg-gray-50 text-red-600 border border-red-600 rounded-xl w-1/4 h-full ml-3 mr-3 hover:text-white hover:bg-red-600 transition duration-300">Cancel</button>

                    <button type="submit" id="modal-add-button" class="flex justify-center items-center bg-gray-50 text-green-600 border border-green-600 rounded-xl w-1/4 h-full ml-3 mr-3 hover:text-white hover:bg-green-600 transition duration-300">Add</button>
                </div>
            </form>
        </div>
    </div>
<div id="navbar" class="flex items-center p-4 bg-gradient-to-r from-white via-gray-100 to-white shadow-lg h-16">
    <button class="inline-flex items-center border border-cyan-500 px-3 py-1.5 rounded-md text-cyan-600 hover:bg-cyan-50">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-6 w-6">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18">
            </path>
        </svg>
        <span class="ml-1 font-bold text-lg">Back</span>
    </button>
    <div class="flex justify-center items-center space-x-4 w-full text-5xl  group">
        <div id="Tim" class="text-blue-600 font-extrabold tracking-wide group-hover:text-orange-500 transition duration-300">TIME</div>
        <div id="Tix" class="text-orange-500 font-extrabold tracking-wide group-hover:text-blue-600 transition duration-300 ">TIX</div>
    </div>

    <!-- goofy code -->
    <img src="../img/no-backround-no-text-logo.png" alt="Logo" class="w-15 h-14 mr-1.5 hover:-rotate-180 trasition duration-200">
</div>

    <div id="user-interface-wrapper" class="flex justify-between h-auto">
        <div id="list-of-intervals" class=" h-5/6 flex-none rounded-r-3xl z-20 w-1/4 border-r-gray-300 border-r border-b border-b-gray-300">
            <div id="list-header" class="flex justify-center items-center text-orange-600 p-2 text-2xl font-mono font-bold border-b border-b-gray-300">
                *TIMER NAME*
            </div>
            <div id="list-content" class="mt-2 mb-2 bg-gray-100 flex justify-center items-center flex-col h-4/5">
                <div class="flex justify-center items-center mt-2">1</div>
                <div class="flex justify-center items-center mt-2">2</div>
                <div class="flex justify-center items-center mt-2">3</div>
                <div class="flex justify-center items-center mt-2">4</div>
            </div>
            <div id="list-footer" class="flex justify-between pt-4 p-2">
                <button class="w-12 h-12 bg-gradient-to-r from-orange-400 to-orange-600 rounded-xl text-white text-lg font-semibold hover:scale-105 hover:shadow-custom-amber hover:shadow-amber-600 transition-transform duration-500">
                    Tbd
                </button>
                <button id="add-button" class="w-12 h-12 bg-gradient-to-r from-blue-500 to-blue-700 rounded-xl text-white text-3xl font-bold flex justify-center items-center hover:scale-105 hover:shadow-custom-amber hover:shadow-blue-600 transition-transform duration-500">
                    +
                </button>
            </div>
        </div>
         
    <div id="timer-interface-wrapper" class="flex flex-grow flex-col justify-between items-center">
        <div class="flex-none pt-3 text-3xl underline-offset-2 underline font-semibold">*Interval name*</div>
        
        <div id="timer" class="flex flex-grow  justify-center items-center">
           <div class="flex justify-center items-center text-5xl text-white bg-slate-600 rounded-full size-96">*timer*</div>
        </div>
    </div> 
</div>

</div>

<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script>
<script src="../dest/modalHandler.js"></script>
</body>
</html>
