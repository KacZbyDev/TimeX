<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../css/output.css">
    <script type="module" src="../dest/timer.js"></script>
</head>

<body id="all" class="flex flex-col min-h-screen">

    <div id="navbar"
        class="flex items-center shadow-lg p-4 border-b-[1px] border-b-gray-300 bg-gradient-to-r from-white via-gray-100 to-white h-16">
        <button
            class="inline-flex items-center border border-blue-secondary px-3 py-1.5 rounded-md text-blue-secondary hover:bg-cyan-50">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                class="h-6 w-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16l-4-4m0 0l4-4m-4 4h18">
                </path>
            </svg>
            <span class="ml-1 font-bold text-lg">Back</span>
        </button>
        <div class="flex justify-center items-center space-x-4 w-full text-5xl  group">
            <div id="Tim"
                class="text-blue-primary font-extrabold tracking-wide group-hover:text-orange-secondary transition duration-300">
                TIME</div>
            <div id="Tix"
                class="text-orange-primary font-extrabold tracking-wide group-hover:text-blue-secondary transition duration-300 ">
                TIX</div>
        </div>

        <img src="../res/img/no-backround-no-text-logo.png" alt="Logo"
            class="w-15 h-14 mr-1.5 hover:-rotate-180 trasition duration-200">
    </div>

    <div id="user-interface-wrapper" class="flex h-[calc(100vh-64px)]">
        <div id="list-of-subtimer"
            class="flex flex-col w-1/4 rounded-r-3xl h-fit max-h border-b border-r shadow-md relative">
            <div id="resizer" class="z-50 w-4 h-full absolute right-0 -mr-2 cursor-ew-resize select-none"></div>
            <!-- The shadow is a square while the border is rounded -->
            <div id="list-header"
                class="flex justify-center items-center text-orange-primary p-2 text-2xl font-mono font-bold border-b shadow-sm">
                *TIMER NAME*</div>

            <div id="list-content" class="relative overflow-y-auto overflow-x-hidden h-96 max-h-full">
                <div class="subtimer">
                    <p class="edit-button">...</p>
                    <p class="name absolute w-full text-center">Start</p>
                    <p class="duration absolute right-4">1</p>
                </div>

                <div class="repeater">
                    <div class="repeater-values">
                        <p class="current-repeats w-full text-center">0</p>
                        <p class="total-repeats absolute right-4">2</p>
                    </div>

                    <div class="subtimer">
                        <p class="edit-button">...</p>
                        <p class="name absolute w-full text-center">Gata</p>
                        <p class="duration absolute right-4">1</p>
                    </div>
                    <div class="repeater">
                        <div class="repeater-values">
                            <p class="current-repeats w-full text-center">0</p>
                            <p class="total-repeats absolute right-4">2</p>
                        </div>
    
                        <div class="subtimer">
                            <p class="edit-button">...</p>
                            <p class="name absolute w-full text-center">Gata</p>
                            <p class="duration absolute right-4">1</p>
                        </div>
                    </div>
                </div>
                
                <div class="subtimer">
                    <p class="edit-button">...</p>
                    <p class="name absolute w-full text-center">Gata</p>
                    <p class="duration absolute right-4">1</p>
                </div>
            </div>

            <div id="list-footer" class="flex justify-between pt-7 p-4">
                <button id="edit-mode-button"
                    class="size-11 bg-orange-secondary rounded-xl text-center text-white hover:shadow-custom-amber hover:shadow-amber-600 hover:scale-125 transition-all duration-500">Reset</button>
                <button id="add-button"
                    class="size-11 bg-blue-secondary rounded-xl text-center text-white font-bold text-4xl flex justify-center items-center pb-1 hover:shadow-custom-amber hover:shadow-blue-600 hover:scale-125 transition-all duration-500">+</button>
            </div>
        </div>

        <div id="timer-interface-wrapper" class="relative flex flex-col flex-grow justify-between overflow-y-auto items-center">
            <p id="current-subtimer-name" class="flex-none text-3xl text-blue-primary underline-offset-2 underline font-semibold pt-4 z-20"></p>
            
            <div id="timer" class="h-full flex absolute justify-center items-center">
                <div class="flex justify-center items-center bg-dark-blue-primary rounded-full size-96">
                    <div id="big-timer-time"    
                        class="absolute flex justify-center items-center text-5xl text-light-blue-primary z-10 select-none"></div>
                    <div id="progress-bar" role="progressbar" aria-valuemax="100" aria-valuemin="0" style="--value:0"
                        class="timer-progress relative flex justify-center items-center size-[90%]"></div>
                </div>
            </div>

            <!-- TODO maybe add reset button here, prev and next -->
            <div class="mb-12 flex justify-between">
                <button id="button" onclick="blur()" class="mx-4 rounded-lg size-10 bg-blue-primary font-extrabold text-base text-white z-20 flex justify-center items-center select-none text-">placeholder</button>
                <button id="pause-button" class="mx-4 rounded-lg size-10 bg-orange-primary font-extrabold text-base text-white z-20 flex justify-center items-center select-none">| |</button>
            </div>
            <!-- another variant
                    <div class="flex justify-center items-center  bg-dark-blue-secondary rounded-full size-96">
                        <div id="progress-time" class="absolute flex justify-center items-center text-5xl text-dark-blue-secondary z-10">12:00</div>
                        <div id="progress-bar"  style="--value: 10" class="timer-progress relative flex justify-center items-center size-[90%] text-5xl text-white"></div>
                    </div> -->
        </div>
    </div>

    <div id="modal" class="absolute h-dvh w-screen hidden">
        <div id="modal-background" class="fixed h-dvh w-screen bg-black opacity-45 z-40"></div>
        <div id="modal-interface"
            class="shadow-xl shadow-gray-500 pb-2 pl-3 pr-3 fixed h-3/4 w-1/3 bg-white m-auto max-h-[100dvh] max-w-[100vh] inset-0 rounded-2xl z-50">
            <div id="modal-header-container"
                class="h-1/6 flex justify-center items-center space-x-4 font-bold text-2xl">
                <div class="text-blue-600">ADD</div>
                <div class="text-orange-600">TIMER</div>
            </div>

            <div id="modal-body-wrapper" class="h-5/6">
                <form id="timer-form" class="h-full flex flex-col justify-between">
                    <!-- Form Body -->
                    <div class="h-5/6 flex flex-col justify-center items-center space-y-4">
                        <label for="timer-name" class="font-medium">Timer Name:</label>
                        <input id="timer-name" type="text" class="border border-gray-300 rounded-md p-2 w-full"
                            placeholder="Enter timer name" required>

                        <label for="timer-duration" class="font-medium">Duration (xx:xx:xx format):</label>
                        <input id="timer-duration" type="text" class="border border-gray-300 rounded-md p-2 w-full"
                            placeholder="Enter duration" required>
                    </div>


                    <div id="button-container" class="flex justify-between h-1/6">
                        <button type="button" id="modal-cancel-button"
                            class="flex justify-center items-center bg-gray-50 text-red-600 border border-red-600 rounded-xl w-1/4 h-full ml-3 mr-3 hover:text-white hover:bg-red-600 transition duration-300">Cancel</button>

                        <button type="submit" id="modal-add-button"
                            class="flex justify-center items-center bg-gray-50 text-green-600 border border-green-600 rounded-xl w-1/4 h-full ml-3 mr-3 hover:text-white hover:bg-green-600 transition duration-300">Add</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="timer-elements" class="hidden">
        <div id="subtimer-example" class="subtimer-active">
            <p class="edit-button">...</p>
            <p class="name absolute w-full text-center"></p>
            <p class="duration absolute right-4">1</p>
        </div>

        <div id="repeater-example" class="repeater">
            <div class="repeater-values">
                <p class="current-repeats w-full text-center">0</p>
                <p class="total-repeats absolute right-4">2</p>
            </div>

            <div class="subtimer">
                <p class="edit-button">...</p>
                <p class="name absolute w-full text-center"></p>
                <p class="duration absolute right-4">1</p>
            </div>
        </div>
    </div>

    <script src="../node_modules/jquery/dist/jquery.min.js" type="text/javascript"></script>
    <script type="module" src="../dest/buttonHandler.js"></script>
</body>

</html>
